name: Drover
options:
  bundleIdPrefix: com.arnab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  DroverKit:
    path: DroverKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.13.0"
targets:
  Drover:
    type: application
    platform: iOS
    sources: [Drover]
    dependencies:
      - package: DroverKit
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arnab.drover
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Drover/Drover.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: 6.0
    info:
      path: Drover/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Required on physical devices to reach the central server over the
        # LAN (192.168.1.x): without this key iOS never shows the Local
        # Network prompt and silently blocks the connection ("Server did not
        # respond to health check"). The Simulator does not enforce Local
        # Network privacy, so sim runs work either way. Tailscale URLs bypass
        # the gate entirely (utun is not treated as local network).
        NSLocalNetworkUsageDescription: >-
          Drover connects to your Drover server on your local network to
          manage agent sessions.
        # Required before any camera access. Unlike the Local Network key,
        # a missing usage description is not a silent block: iOS terminates
        # the app the moment AVCaptureSession touches the camera.
        NSCameraUsageDescription: >-
          Drover uses the camera to scan the pairing QR code shown by
          drover-server. The camera is not used for anything else.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.arnab.drover.refresh]
    # Requires a paid team: neither the push nor the time-sensitive
    # entitlement is grantable to a personal one, which is why this app spent
    # its first months on local notifications alone (iOS silently downgraded
    # every .timeSensitive alert to .active). Adding `aps-environment` also
    # makes automatic signing enable the Push Notifications capability on the
    # App ID, so the first build after this change needs network and
    # -allowProvisioningUpdates, which scripts/deploy-ios.sh already passes.
    # Referenced via CODE_SIGN_ENTITLEMENTS rather than xcodegen's
    # `entitlements:` key, because that key *generates* the file from inline
    # `properties` and would overwrite the checked-in one with an empty plist.
    # Deliberately still just [fetch]: "needs you" arrives as a visible alert
    # push, which needs no background mode. `remote-notification` would only
    # be required for silent content-available pushes, and adding it without
    # implementing didReceiveRemoteNotification would be dead config.
  DroverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DroverKit/Tests/DroverKitTests
      - DroverTests
    dependencies:
      - target: Drover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
  # UI smoke harness (Settings onboarding against the live server with a
  # deliberately wrong token). Separate scheme so unit runs stay fast.
  DroverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DroverUITests]
    dependencies:
      - target: Drover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
schemes:
  Drover:
    build:
      targets:
        Drover: all
    test:
      targets: [DroverTests]
  DroverUITests:
    build:
      targets:
        DroverUITests: all
    test:
      targets: [DroverUITests]
