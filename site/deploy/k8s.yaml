# Internal sign-off deployment for the Drover site.
#
# Placeholders to replace before applying:
#   REGISTRY/drover-site:TAG   the image built from site/Dockerfile
#   nodePort: 30080            any free port in the cluster's NodePort range
#
# No secrets, config maps or persistent volumes: the image is the whole site.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drover-site
  labels:
    app.kubernetes.io/name: drover-site
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: drover-site
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drover-site
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: REGISTRY/drover-site:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp files in /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: drover-site
  labels:
    app.kubernetes.io/name: drover-site
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: drover-site
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
