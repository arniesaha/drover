name: iOS distribution archive

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Approved CFBundleShortVersionString"
        required: true
        type: string
      build:
        description: "Approved CFBundleVersion"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    name: Archive signed iOS candidate
    # workflow_dispatch can target any ref. Evaluate this before the protected
    # environment is entered so an unreviewed branch never receives its inputs.
    if: github.ref == 'refs/heads/main'
    # Configure this as a protected GitHub environment before dispatching.
    # It is the only place distribution credentials and profiles may be made
    # available; this workflow never runs on a pull request.
    environment: ios-distribution
    runs-on: macos-26
    env:
      # GitHub's macOS 26 image currently documents this installed Xcode path.
      # Keep it explicit so an image-default change cannot alter the SDK used
      # for an App Store candidate without a reviewed workflow change.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CANDIDATE_VERSION: ${{ github.event.inputs.version }}
      CANDIDATE_BUILD: ${{ github.event.inputs.build }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Report the selected Xcode and iPhoneOS SDK
      run: |
        test -d "$DEVELOPER_DIR" || {
          echo "selected Xcode is not installed on this runner" >&2
          exit 1
        }
        printf 'DEVELOPER_DIR %s\n' "$DEVELOPER_DIR"
        xcodebuild -version
        SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
        echo "iPhoneOS SDK $SDK"
        case "$SDK" in
          26|26.*|2[7-9]|[3-9][0-9]*) ;;
          *) echo "iPhoneOS SDK 26.0 or later is required" >&2; exit 1 ;;
        esac

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set up deterministic distribution signing
      id: signing
      env:
        DROVER_DISTRIBUTION_P12_BASE64: ${{ secrets.DROVER_DISTRIBUTION_P12_BASE64 }}
        DROVER_DISTRIBUTION_P12_PASSWORD: ${{ secrets.DROVER_DISTRIBUTION_P12_PASSWORD }}
        DROVER_DISTRIBUTION_PROFILE_BASE64: ${{ secrets.DROVER_DISTRIBUTION_PROFILE_BASE64 }}
        DROVER_DISTRIBUTION_TEAM_ID: ${{ secrets.DROVER_DISTRIBUTION_TEAM_ID }}
        DROVER_DISTRIBUTION_PROFILE_UUID: ${{ secrets.DROVER_DISTRIBUTION_PROFILE_UUID }}
        DROVER_DISTRIBUTION_IDENTITY_SHA1: ${{ secrets.DROVER_DISTRIBUTION_IDENTITY_SHA1 }}
        DROVER_DISTRIBUTION_IDENTITY_NAME: ${{ secrets.DROVER_DISTRIBUTION_IDENTITY_NAME }}
      run: |
        scripts/ios/setup_distribution_signing.sh \
          --workspace "$RUNNER_TEMP/drover-distribution-signing" \
          --github-output "$GITHUB_OUTPUT"

    - name: Archive and verify the approved candidate
      run: |
        scripts/ios/archive.sh \
          --version "$CANDIDATE_VERSION" \
          --build "$CANDIDATE_BUILD" \
          --output "$RUNNER_TEMP/drover-ios-$CANDIDATE_VERSION-$CANDIDATE_BUILD" \
          --signing-config "${{ steps.signing.outputs.signing_config }}"

    - name: Upload sanitized candidate metadata
      uses: actions/upload-artifact@v4
      with:
        name: drover-ios-${{ github.event.inputs.version }}-${{ github.event.inputs.build }}-metadata
        path: ${{ runner.temp }}/drover-ios-${{ github.event.inputs.version }}-${{ github.event.inputs.build }}/archive-record.json
        if-no-files-found: error

    - name: Remove temporary signing material
      if: ${{ always() && steps.signing.outputs.state_file != '' }}
      run: |
        scripts/ios/cleanup_distribution_signing.sh \
          --state "${{ steps.signing.outputs.state_file }}"
