name: Trusted Mac verification

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python on trusted Mac
    runs-on: [self-hosted, macOS, ARM64, drover-ci]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Configure git identity for tests
      run: |
        git config user.email "ci@drover.local"
        git config user.name "Drover CI"

    - name: Check changed Python files with Black
      env:
        BASE_SHA: ${{ github.event.before }}
      run: |
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          BASE_SHA="$(git rev-parse HEAD~1)"
        fi
        PY_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- 'src/**/*.py' 'tests/*.py' 'tests/**/*.py')"
        if [ -z "$PY_FILES" ]; then
          echo "No changed Python files to format-check."
        else
          echo "$PY_FILES" | xargs black --check
        fi

    - name: Run tests with pytest
      run: pytest tests/

  ios:
    name: iOS on trusted Mac
    runs-on: [self-hosted, macOS, ARM64, drover-ci]
    defaults:
      run:
        working-directory: apps/drover
    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Ensure XcodeGen is available
      run: |
        if ! command -v xcodegen >/dev/null 2>&1; then
          brew install xcodegen
        fi

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Select iPhone simulator
      run: |
        simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
        if [ -z "$simulator_id" ]; then
          echo "No available iPhone simulator found." >&2
          xcrun simctl list devices available >&2
          exit 1
        fi
        echo "SIMULATOR_DESTINATION=id=$simulator_id" >> "$GITHUB_ENV"
        echo "Selected simulator id=$simulator_id"

    - name: Resolve Swift packages
      run: |
        xcodebuild -project Drover.xcodeproj \
          -scheme Drover \
          -resolvePackageDependencies

    - name: Run unit tests
      run: |
        set -o pipefail
        xcodebuild -project Drover.xcodeproj \
          -scheme Drover \
          -destination "$SIMULATOR_DESTINATION" \
          -resultBundlePath "$RUNNER_TEMP/DroverTests.xcresult" \
          test

    - name: Build UI test bundle
      run: |
        set -o pipefail
        xcodebuild -project Drover.xcodeproj \
          -scheme DroverUITests \
          -destination "$SIMULATOR_DESTINATION" \
          -resultBundlePath "$RUNNER_TEMP/DroverUITests.xcresult" \
          build-for-testing

    - name: Upload unit test result bundle
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: DroverTests.xcresult
        path: ${{ runner.temp }}/DroverTests.xcresult
        if-no-files-found: ignore

    - name: Upload UI build result bundle
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: DroverUITests.xcresult
        path: ${{ runner.temp }}/DroverUITests.xcresult
        if-no-files-found: ignore
