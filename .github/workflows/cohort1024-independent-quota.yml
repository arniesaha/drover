name: Cohort 1024 independent quota evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cohort1024-independent-quota-5202
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'arniesaha/drover' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Fetch trusted producer and immutable candidate without credentials
      env:
        TRUSTED_SHA: ${{ github.sha }}
      run: |
        git init trusted
        git -C trusted fetch --depth=1 https://github.com/arniesaha/drover.git "$TRUSTED_SHA"
        git -C trusted checkout --detach FETCH_HEAD
        git init candidate
        git -C candidate fetch --depth=1 https://github.com/arniesaha/drover.git 5202c2359483a58b2916c58acac5f11ee2df20b8
        git -C candidate checkout --detach FETCH_HEAD
        test "$(git -C candidate rev-parse HEAD)" = 5202c2359483a58b2916c58acac5f11ee2df20b8
    - name: Execute fixed credential-free proof
      run: |
        python -m pip install uv==0.13.6
        uv sync --project candidate --locked --extra dev --python 3.11
        python -I trusted/docs/quality-pilots/p1-runner/run-proof.py --source candidate --python "$PWD/candidate/.venv/bin/python" --output "$RUNNER_TEMP/proof"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pinned-quota-proof
        path: ${{ runner.temp }}/proof/
        if-no-files-found: error
  publish:
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
    - name: Fetch only protected-main producer; never candidate code in this job
      env:
        TRUSTED_SHA: ${{ github.sha }}
      run: |
        git init trusted
        git -C trusted fetch --depth=1 https://github.com/arniesaha/drover.git "$TRUSTED_SHA"
        git -C trusted checkout --detach FETCH_HEAD
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: pinned-quota-proof
        path: proof
    - name: Publish bounded revision-bound check, or reconcile identical prior effect
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python -I trusted/docs/quality-pilots/p1-runner/publish-check.py --profile trusted/docs/quality-pilots/p1-runner/profile-candidate.json --proof proof/proof.json
