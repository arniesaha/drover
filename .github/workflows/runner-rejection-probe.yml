name: Runner rejection probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  rejection-probe:
    name: Untrusted PR must be rejected
    runs-on: [self-hosted, macOS, ARM64, drover-ci]
    steps:
    - name: Write rejection marker
      run: touch "$RUNNER_TEMP/drover-task7-rejection-marker"

    - name: Checkout must not run
      uses: actions/checkout@v4
