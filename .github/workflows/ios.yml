name: iOS CI

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/drover

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select test scope
      id: scope
      working-directory: .
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        python3 scripts/ci/select_test_scope.py \
          --base "$BASE_SHA" \
          --github-output "$GITHUB_OUTPUT"

    - name: Run lightweight checks
      if: steps.scope.outputs.ios != 'true'
      working-directory: .
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: git diff --check "$BASE_SHA"...HEAD

    - name: Show Xcode version
      if: steps.scope.outputs.ios == 'true'
      run: xcodebuild -version

    - name: Install XcodeGen
      if: steps.scope.outputs.ios == 'true'
      run: brew install xcodegen

    - name: Generate Xcode project
      if: steps.scope.outputs.ios == 'true'
      run: xcodegen generate

    - name: Run DroverKit package tests
      if: steps.scope.outputs.ios == 'true'
      run: swift test --package-path DroverKit --jobs 2

    - name: Select iPhone simulator
      if: steps.scope.outputs.ios == 'true'
      run: |
        simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
        if [ -z "$simulator_id" ]; then
          echo "No available iPhone simulator found." >&2
          xcrun simctl list devices available >&2
          exit 1
        fi
        echo "SIMULATOR_DESTINATION=id=$simulator_id" >> "$GITHUB_ENV"
        echo "Selected simulator id=$simulator_id"

    - name: Resolve Swift packages
      if: steps.scope.outputs.ios == 'true'
      run: |
        xcodebuild -project Drover.xcodeproj \
          -scheme Drover \
          -resolvePackageDependencies

    - name: Run app unit tests
      if: steps.scope.outputs.ios == 'true'
      run: |
        set -o pipefail
        xcodebuild -project Drover.xcodeproj \
          -scheme Drover \
          -destination "$SIMULATOR_DESTINATION" \
          -resultBundlePath "$RUNNER_TEMP/DroverTests.xcresult" \
          test

    # AccessibilityJourneyUITests is deliberately not listed: it has never
    # passed a full run, on CI or locally, and gating every iOS PR on it
    # would make a red build carry no information. See the follow-up issue.
    - name: Run deterministic UI journey
      if: steps.scope.outputs.ios == 'true'
      run: |
        set -o pipefail
        xcodebuild -project Drover.xcodeproj \
          -scheme DroverUITests \
          -destination "$SIMULATOR_DESTINATION" \
          -only-testing:DroverUITests/DeterministicJourneyUITests \
          -resultBundlePath "$RUNNER_TEMP/DroverUITests.xcresult" \
          test

    - name: Upload unit test result bundle
      if: failure() && steps.scope.outputs.ios == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: DroverTests.xcresult
        path: ${{ runner.temp }}/DroverTests.xcresult
        if-no-files-found: ignore

    - name: Upload deterministic UI test result bundle
      if: failure() && steps.scope.outputs.ios == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: DroverUITests.xcresult
        path: ${{ runner.temp }}/DroverUITests.xcresult
        if-no-files-found: ignore
