name: iOS CI

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/drover

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select test scope
      id: scope
      working-directory: .
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # site/ paths are dropped before classification; see the same step in
      # ci.yml. The site has its own build check in site.yml.
      run: |
        if [ -z "$BASE_SHA" ]; then
          python3 scripts/ci/select_test_scope.py --github-output "$GITHUB_OUTPUT"
          exit 0
        fi
        paths=()
        while IFS= read -r path; do
          paths+=("$path")
        done < <(git diff --name-only "$BASE_SHA"...HEAD \
          | grep -vE '^(site/|\.github/workflows/site\.yml$)' || true)
        if [ "${#paths[@]}" -eq 0 ]; then
          echo "only site paths changed; skipping the iOS suite"
          printf 'python=false\nios=false\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python3 scripts/ci/select_test_scope.py \
          --github-output "$GITHUB_OUTPUT" "${paths[@]}"

    - name: Run lightweight checks
      if: steps.scope.outputs.ios != 'true'
      working-directory: .
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: git diff --check "$BASE_SHA"...HEAD

    - name: Show Xcode version
      if: steps.scope.outputs.ios == 'true'
      run: xcodebuild -version

    - name: Install XcodeGen
      if: steps.scope.outputs.ios == 'true'
      run: brew install xcodegen

    - name: Generate Xcode project
      if: steps.scope.outputs.ios == 'true'
      run: xcodegen generate

    - name: Run DroverKit package tests
      if: steps.scope.outputs.ios == 'true'
      run: swift test --package-path DroverKit --jobs 2

    - name: Select iPhone simulator
      if: steps.scope.outputs.ios == 'true'
      run: |
        simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
        if [ -z "$simulator_id" ]; then
          echo "No available iPhone simulator found." >&2
          xcrun simctl list devices available >&2
          exit 1
        fi
        echo "SIMULATOR_DESTINATION=id=$simulator_id" >> "$GITHUB_ENV"
        echo "Selected simulator id=$simulator_id"

    - name: Resolve Swift packages
      if: steps.scope.outputs.ios == 'true'
      run: |
        xcodebuild -project Drover.xcodeproj \
          -scheme Drover \
          -resolvePackageDependencies

    - name: Run app unit tests
      if: steps.scope.outputs.ios == 'true'
      run: |
        set -o pipefail
        xcodebuild -project Drover.xcodeproj \
          -scheme Drover \
          -destination "$SIMULATOR_DESTINATION" \
          -resultBundlePath "$RUNNER_TEMP/DroverTests.xcresult" \
          test

    - name: Run deterministic and accessibility UI journeys
      if: steps.scope.outputs.ios == 'true'
      run: |
        set -o pipefail
        xcodebuild -project Drover.xcodeproj \
          -scheme DroverUITests \
          -destination "$SIMULATOR_DESTINATION" \
          -parallel-testing-enabled NO \
          -only-testing:DroverUITests/DeterministicJourneyUITests \
          -only-testing:DroverUITests/InsightDetailFixtureUITests \
          -only-testing:DroverUITests/ObservabilityFixtureUITests \
          -only-testing:DroverUITests/AccessibilityJourneyUITests \
          -skip-testing:DroverUITests/AccessibilityJourneyUITests/testIdleTerminalIsExactStaticWithSystemReduceMotion \
          -resultBundlePath "$RUNNER_TEMP/DroverUITests.xcresult" \
          test

    - name: Run exact-static artwork journey with system Reduce Motion
      if: steps.scope.outputs.ios == 'true'
      run: |
        set -euo pipefail
        simulator_id="${SIMULATOR_DESTINATION#id=}"
        preference="$HOME/Library/Developer/CoreSimulator/Devices/$simulator_id/data/Library/Preferences/com.apple.Accessibility.plist"
        backup="$RUNNER_TEMP/ReduceMotion-preference.plist"
        # XCTest may already have shut down its destination after the suite.
        # Ignore only the confirmed Shutdown state, never a genuine simctl failure.
        if ! xcrun simctl shutdown "$simulator_id"; then
          simulator_state="$(xcrun simctl list devices --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["state"] for group in devices.values() for d in group if d["udid"] == sys.argv[1]))' "$simulator_id")"
          test "$simulator_state" = "Shutdown"
        fi
        cp "$preference" "$backup"
        restore_preference() {
          xcrun simctl shutdown "$simulator_id" || true
          cp "$backup" "$preference"
        }
        trap restore_preference EXIT
        # iOS 18.5 stores this as an integer. PlistBuddy Set ... true logs
        # Unrecognized Integer Format but returns zero and leaves it disabled.
        python3 - "$preference" <<'PYTHON'
        import pathlib, plistlib, sys
        path = pathlib.Path(sys.argv[1])
        data = plistlib.loads(path.read_bytes())
        prior = data.get("ReduceMotionEnabled")
        print(f"ReduceMotionEnabled before: {prior!r} ({type(prior).__name__})")
        data["ReduceMotionEnabled"] = 1
        path.write_bytes(plistlib.dumps(data))
        actual = plistlib.loads(path.read_bytes())["ReduceMotionEnabled"]
        assert type(actual) is int and actual == 1, "Reduce Motion preference write failed"
        print("ReduceMotionEnabled verified integer 1; app-observed assertion follows")
        PYTHON
        xcrun simctl boot "$simulator_id"
        xcrun simctl bootstatus "$simulator_id" -b
        xcodebuild -project Drover.xcodeproj \
          -scheme DroverUITests \
          -destination "$SIMULATOR_DESTINATION" \
          -parallel-testing-enabled NO \
          -only-testing:DroverUITests/AccessibilityJourneyUITests/testIdleTerminalIsExactStaticWithSystemReduceMotion \
          -resultBundlePath "$RUNNER_TEMP/DroverReduceMotionUITests.xcresult" \
          test-without-building

    - name: Upload Reduce Motion test result bundle
      if: always() && steps.scope.outputs.ios == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: DroverReduceMotionUITests.xcresult
        path: ${{ runner.temp }}/DroverReduceMotionUITests.xcresult
        if-no-files-found: ignore
        retention-days: 3

    - name: Upload unit test result bundle
      if: failure() && steps.scope.outputs.ios == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: DroverTests.xcresult
        path: ${{ runner.temp }}/DroverTests.xcresult
        if-no-files-found: ignore

    - name: Upload deterministic UI test result bundle
      if: always() && steps.scope.outputs.ios == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: DroverUITests.xcresult
        path: ${{ runner.temp }}/DroverUITests.xcresult
        if-no-files-found: ignore
        retention-days: 3
