name: TestFlight validation-only contract evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate CFBundleShortVersionString for validation only
        required: true
        default: "0.2.0"
        type: string
      build:
        description: Candidate CFBundleVersion for validation only
        required: true
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-validation-only
  cancel-in-progress: false

jobs:
  validation-only:
    # workflow_dispatch can target any ref. Refuse it before protected inputs
    # exist so the evidence action is bound to a main SHA only.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      checks: read
    environment: ios-testflight-upload
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_BUILD: ${{ inputs.build }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Bind checkout to dispatch SHA and require its iOS CI
      timeout-minutes: 2
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 scripts/ios/require_ios_ci.py
    - name: Report selected Xcode and iPhoneOS SDK
      run: |
        test -d "$DEVELOPER_DIR"
        printf 'DEVELOPER_DIR %s\n' "$DEVELOPER_DIR"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Generate Xcode project
      working-directory: apps/drover
      run: xcodegen generate
    - name: Snapshot runner keychain search list
      run: |
        python3 - <<'PY'
        import json, os, shlex, subprocess
        from pathlib import Path
        try:
            root = Path(os.environ["RUNNER_TEMP"]) / "drover-validation-keychain-state"
            root.mkdir(mode=0o700)
            result = subprocess.run(["security", "list-keychains", "-d", "user"], capture_output=True, text=True, check=True)
            with (root / "keychain-search-list.json").open("x") as output:
                json.dump(shlex.split(result.stdout), output)
        except Exception:
            raise SystemExit("keychain snapshot failed; private diagnostics discarded")
        PY
    - name: Set up deterministic distribution signing
      id: signing
      env:
        DROVER_DISTRIBUTION_P12_BASE64: ${{ secrets.DROVER_DISTRIBUTION_P12_BASE64 }}
        DROVER_DISTRIBUTION_P12_PASSWORD: ${{ secrets.DROVER_DISTRIBUTION_P12_PASSWORD }}
        DROVER_DISTRIBUTION_PROFILE_BASE64: ${{ secrets.DROVER_DISTRIBUTION_PROFILE_BASE64 }}
        DROVER_WIDGET_PROFILE_BASE64: ${{ secrets.DROVER_WIDGET_PROFILE_BASE64 }}
        DROVER_DISTRIBUTION_TEAM_ID: ${{ secrets.DROVER_DISTRIBUTION_TEAM_ID }}
        DROVER_DISTRIBUTION_PROFILE_UUID: ${{ secrets.DROVER_DISTRIBUTION_PROFILE_UUID }}
        DROVER_WIDGET_PROFILE_UUID: ${{ secrets.DROVER_WIDGET_PROFILE_UUID }}
        DROVER_DISTRIBUTION_IDENTITY_SHA1: ${{ secrets.DROVER_DISTRIBUTION_IDENTITY_SHA1 }}
        DROVER_DISTRIBUTION_IDENTITY_NAME: ${{ secrets.DROVER_DISTRIBUTION_IDENTITY_NAME }}
      run: |
        scripts/ios/setup_distribution_signing.sh \
          --workspace "$RUNNER_TEMP/drover-validation-signing" \
          --github-output "$GITHUB_OUTPUT"
    - name: Archive and verify validation-only candidate
      run: |
        scripts/ios/archive.sh \
          --version "$CANDIDATE_VERSION" --build "$CANDIDATE_BUILD" \
          --output "$RUNNER_TEMP/drover-validation-candidate" \
          --signing-config "$RUNNER_TEMP/drover-validation-signing/signing.xcconfig" \
          --channel testflight-production
    - name: Export and verify validation-only IPA
      run: |
        scripts/ios/export_ipa.sh \
          --archive "$RUNNER_TEMP/drover-validation-candidate/Drover.xcarchive" \
          --output "$RUNNER_TEMP/drover-validation-export" \
          --export-options "$RUNNER_TEMP/drover-validation-signing/ExportOptions.plist" \
          --version "$CANDIDATE_VERSION" --build "$CANDIDATE_BUILD"
        scripts/ios/verify_widget_ipa.sh \
          --ipa "$RUNNER_TEMP/drover-validation-export/Drover.ipa" \
          --expected-profile-uuid "${{ steps.signing.outputs.widget_profile_uuid }}"
    - name: Materialize transient validation credential
      env:
        DROVER_APPSTORE_API_KEY_ID: ${{ secrets.DROVER_APPSTORE_API_KEY_ID }}
        DROVER_APPSTORE_API_ISSUER_ID: ${{ secrets.DROVER_APPSTORE_API_ISSUER_ID }}
        DROVER_APPSTORE_API_PRIVATE_KEY_BASE64: ${{ secrets.DROVER_APPSTORE_API_PRIVATE_KEY_BASE64 }}
      run: |
        python3 - <<'PY'
        import base64, os, re, shutil
        from pathlib import Path
        try:
            root = Path(os.environ["RUNNER_TEMP"])
            key_id = os.environ["DROVER_APPSTORE_API_KEY_ID"]
            if not re.fullmatch(r"[A-Z0-9]{8,20}", key_id):
                raise ValueError()
            directory = root / "drover-validation-key"
            directory.mkdir(mode=0o700)
            material = base64.b64decode(os.environ["DROVER_APPSTORE_API_PRIVATE_KEY_BASE64"], validate=True)
            path = directory / f"AuthKey_{key_id}.p8"
            descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
            with os.fdopen(descriptor, "wb") as output:
                output.write(material)
        except Exception:
            shutil.rmtree(Path(os.environ["RUNNER_TEMP"]) / "drover-validation-key", ignore_errors=True)
            raise SystemExit("validation credential unavailable; private diagnostics discarded")
        PY
    - name: Capture validation-only contract evidence
      env:
        DROVER_APPSTORE_API_KEY_ID: ${{ secrets.DROVER_APPSTORE_API_KEY_ID }}
        DROVER_APPSTORE_API_ISSUER_ID: ${{ secrets.DROVER_APPSTORE_API_ISSUER_ID }}
      run: |
        PRIVATE_OUTPUT="$(mktemp -d "$RUNNER_TEMP/drover-validation-contract.XXXXXX")"
        chmod 700 "$PRIVATE_OUTPUT"
        trap 'rm -rf "$PRIVATE_OUTPUT"' EXIT
        python3 scripts/ios/validate_testflight_contract.py \
          --ipa "$RUNNER_TEMP/drover-validation-export/Drover.ipa" \
          --api-key-id "$DROVER_APPSTORE_API_KEY_ID" \
          --api-issuer "$DROVER_APPSTORE_API_ISSUER_ID" \
          --private-keys-dir "$RUNNER_TEMP/drover-validation-key" \
          --private-output-dir "$PRIVATE_OUTPUT" \
          --record "$RUNNER_TEMP/validation-contract-receipt.json" \
          --source-sha "$GITHUB_SHA" --version "$CANDIDATE_VERSION" --build "$CANDIDATE_BUILD"
    - name: Upload sanitized validation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: testflight-validation-contract-evidence
        path: ${{ runner.temp }}/validation-contract-receipt.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Remove temporary credentials and signing material
      if: always()
      run: |
        python3 - <<'PY'
        import json, os, shutil, subprocess
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        failed = False
        try:
            snapshot = root / "drover-validation-keychain-state/keychain-search-list.json"
            if snapshot.is_file():
                original = json.loads(snapshot.read_text())
                subprocess.run(["security", "list-keychains", "-d", "user", "-s", *original], capture_output=True, check=True)
            else:
                failed = True
            state = root / "drover-validation-signing/signing-state"
            if state.is_file():
                subprocess.run(["scripts/ios/cleanup_distribution_signing.sh", "--state", str(state)], capture_output=True, check=True)
            else:
                failed = True
        except Exception:
            failed = True
        for name in ("drover-validation-key", "drover-validation-keychain-state", "drover-validation-signing"):
            try:
                target = root / name
                if target.exists() and not target.is_symlink():
                    shutil.rmtree(target)
                if target.exists():
                    failed = True
            except Exception:
                failed = True
        if failed:
            raise SystemExit("validation credential cleanup failed; private diagnostics discarded")
        PY
