name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish, e.g. v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
    # On a tag push GITHUB_REF_NAME is the tag, which is what we want. On
    # workflow_dispatch it is the *branch*, so a manual run without this
    # would publish a release named "main". Resolve once and use RELEASE_TAG
    # everywhere below.
    #
    # github.event.inputs, not inputs. The bare `inputs` context exists only
    # for workflow_dispatch and workflow_call, so referencing it in a workflow
    # that also triggers on push fails the whole run at load time with
    # "Unrecognized named-value: 'inputs'" -- a startup_failure with no logs
    # and no job, which is how v0.1.1 got tagged with no release attached.
    # github.event.inputs is always defined and is simply null on a push.
    - name: Resolve the tag being released
      run: |
        TAG="${{ github.event.inputs.ref || github.ref_name }}"
        case "$TAG" in
          v*) ;;
          *) echo "refusing to release non-tag ref: $TAG" >&2; exit 1 ;;
        esac
        echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}

    # uv is installed via pip rather than astral-sh/setup-uv, because this
    # repository restricts Actions to an allowlist of `actions/*` with
    # verified-creator actions disallowed. A third-party action there does not
    # fail the step, it fails the entire run at load time as a
    # startup_failure with no job and no logs, which is how v0.1.1 was tagged
    # twice with no release attached. Check the allowlist before adding any
    # `uses:` outside `actions/*`:
    #   gh api repos/arniesaha/drover/actions/permissions/selected-actions
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: python -m pip install "uv==0.5.29"

    - name: Build the wheel
      run: uv build --wheel --out-dir dist

    # A wheel is named after pyproject's version, not the tag. If those drift
    # every step here still succeeds and the release looks fine, but the
    # failure lands later on a stranger's machine as a 404 mid-install. Worse,
    # a host that installed "0.1.1" from a package reporting 0.1.0 never
    # converges and reinstalls on every heartbeat. Fail the build instead.
    - name: Refuse a wheel that does not match the tag
      run: |
        expected="drover-${RELEASE_TAG#v}-py3-none-any.whl"
        if [ ! -f "dist/$expected" ]; then
          echo "tag ${RELEASE_TAG} expects dist/$expected, but the build produced:" >&2
          ls -1 dist >&2
          echo "bump version in pyproject.toml to match the tag" >&2
          exit 1
        fi

    - name: Export a hash-pinned universal lockfile
      run: |
        uv export --no-emit-project --no-dev --format requirements-txt \
          > dist/requirements.lock.txt
        # Load-bearing: a lockfile without hashes makes --require-hashes a
        # no-op at install time, which would leave "checksum verified" true
        # of only Drover's own small fraction of the installed bytes.
        grep -q -- "--hash=sha256:" dist/requirements.lock.txt

    - name: Generate the checksum manifest
      run: |
        cd dist
        sha256sum drover-*-py3-none-any.whl requirements.lock.txt \
          > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${RELEASE_TAG}" \
          --title "${RELEASE_TAG}" \
          --generate-notes \
          dist/drover-*-py3-none-any.whl \
          dist/requirements.lock.txt \
          dist/SHA256SUMS.txt

  # Install the release we just published, on a clean machine, the way a
  # stranger would. Unit tests cannot catch this class of bug: v0.1.1 passed
  # every suite, published three correct artifacts, and still could not
  # install, because drover-server had no --version flag and install.sh
  # smoke-tests exactly that before activating. The only thing that finds
  # that is running the real script against the real release.
  #
  # Runs after publishing rather than before, because there is no release to
  # install until then. A failure here means the release is bad and should be
  # deleted, not that the check is wrong.
  verify-install:
    name: Install the published release on a clean machine
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Wait for the release assets to be queryable
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.event.inputs.ref || github.ref_name }}"
        for _ in $(seq 1 30); do
          if gh release view "$TAG" --json assets \
               --jq '.assets[].name' | grep -q 'py3-none-any.whl'; then
            exit 0
          fi
          sleep 5
        done
        echo "release $TAG never exposed a wheel" >&2
        exit 1

    - name: Run install.sh exactly as a user would
      run: |
        set -x
        bash install.sh --version "${{ github.event.inputs.ref || github.ref_name }}"

    - name: The runtime is laid out and activated
      run: |
        VERSION="$(echo "${{ github.event.inputs.ref || github.ref_name }}" | sed 's/^v//')"
        test -d "$HOME/.drover/runtime/$VERSION" \
          || { echo "no runtime/$VERSION" >&2; exit 1; }
        test -L "$HOME/.drover/runtime/current" \
          || { echo "current is not a symlink" >&2; exit 1; }
        test "$(readlink "$HOME/.drover/runtime/current")" = "$VERSION" \
          || { echo "current does not point at $VERSION" >&2; exit 1; }

    - name: The installed build runs and reports its own version
      run: |
        VERSION="$(echo "${{ github.event.inputs.ref || github.ref_name }}" | sed 's/^v//')"
        # This is the assertion v0.1.1 would have failed.
        "$HOME/.drover/runtime/current/bin/drover-server" --version
        "$HOME/.drover/runtime/current/bin/drover-server" --version \
          | grep -q "$VERSION"

    # Every other assertion here runs the binary by absolute path, which is
    # precisely how the gap survived: the install was correct and
    # `drover-server` still was not a command.
    - name: drover-server is reachable as a command, not just on disk
      run: |
        VERSION="$(echo "${{ github.event.inputs.ref || github.ref_name }}" | sed 's/^v//')"
        LINK="$HOME/.local/bin/drover-server"
        test -L "$LINK" \
          || { echo "the installer did not link drover-server" >&2; exit 1; }
        # Through current, so the link follows a symlink flip rather than
        # pinning the version that happened to be installed first.
        readlink "$LINK"
        readlink "$LINK" | grep -q 'runtime/current/bin/drover-server'
        # And it runs as a bare command name with that directory on PATH.
        PATH="$HOME/.local/bin:$PATH" drover-server --version | grep -q "$VERSION"

    - name: Config carries the detected address
      run: |
        grep -q '^advertised_url' "$HOME/.drover/config.toml"
        grep -q '^metrics_host' "$HOME/.drover/config.toml"
        cat "$HOME/.drover/config.toml"

    - name: Service units point at current and set PATH explicitly
      run: |
        UNIT="$HOME/.config/systemd/user/drover-server.service"
        test -f "$UNIT" || { echo "no server unit written" >&2; exit 1; }
        test -f "$HOME/.config/systemd/user/drover-harnessd.service"
        cat "$UNIT"
        # Both properties have silently broken real hosts before.
        grep -q 'Environment=PATH=' "$UNIT"
        grep -q 'runtime/current/bin' "$UNIT"
        grep -qv 'runtime/0\.' "$UNIT"

    - name: The server actually serves, and pairing prints a QR
      run: |
        # Started directly rather than through systemd: `systemctl --user`
        # is not reliably available on a hosted runner, and install.sh
        # tolerates that by design. What matters here is that the installed
        # build works, not which supervisor started it.
        pkill -f 'drover-server run' || true
        "$HOME/.drover/runtime/current/bin/drover-server" run &
        for _ in $(seq 1 30); do
          curl -fsS --max-time 2 http://127.0.0.1:7080/healthz && break
          sleep 2
        done
        curl -fsS --max-time 5 http://127.0.0.1:7080/healthz

        OUT="$("$HOME/.drover/runtime/current/bin/drover-server" pair)"
        echo "$OUT"
        echo "$OUT" | grep -q 'drover://' || { echo "no pairing URL" >&2; exit 1; }
        echo "$OUT" | grep -q '█' || { echo "no QR rendered" >&2; exit 1; }
        pkill -f 'drover-server run' || true
