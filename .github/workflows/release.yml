name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish, e.g. v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
    # On a tag push GITHUB_REF_NAME is the tag, which is what we want. On
    # workflow_dispatch it is the *branch*, so a manual run without this
    # would publish a release named "main". Resolve once and use RELEASE_TAG
    # everywhere below.
    #
    # github.event.inputs, not inputs. The bare `inputs` context exists only
    # for workflow_dispatch and workflow_call, so referencing it in a workflow
    # that also triggers on push fails the whole run at load time with
    # "Unrecognized named-value: 'inputs'" -- a startup_failure with no logs
    # and no job, which is how v0.1.1 got tagged with no release attached.
    # github.event.inputs is always defined and is simply null on a push.
    - name: Resolve the tag being released
      run: |
        TAG="${{ github.event.inputs.ref || github.ref_name }}"
        case "$TAG" in
          v*) ;;
          *) echo "refusing to release non-tag ref: $TAG" >&2; exit 1 ;;
        esac
        echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}

    # uv is installed via pip rather than astral-sh/setup-uv, because this
    # repository restricts Actions to an allowlist of `actions/*` with
    # verified-creator actions disallowed. A third-party action there does not
    # fail the step, it fails the entire run at load time as a
    # startup_failure with no job and no logs, which is how v0.1.1 was tagged
    # twice with no release attached. Check the allowlist before adding any
    # `uses:` outside `actions/*`:
    #   gh api repos/arniesaha/drover/actions/permissions/selected-actions
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: python -m pip install "uv==0.5.29"

    - name: Build the wheel
      run: uv build --wheel --out-dir dist

    # A wheel is named after pyproject's version, not the tag. If those drift
    # every step here still succeeds and the release looks fine, but the
    # failure lands later on a stranger's machine as a 404 mid-install. Worse,
    # a host that installed "0.1.1" from a package reporting 0.1.0 never
    # converges and reinstalls on every heartbeat. Fail the build instead.
    - name: Refuse a wheel that does not match the tag
      run: |
        expected="drover-${RELEASE_TAG#v}-py3-none-any.whl"
        if [ ! -f "dist/$expected" ]; then
          echo "tag ${RELEASE_TAG} expects dist/$expected, but the build produced:" >&2
          ls -1 dist >&2
          echo "bump version in pyproject.toml to match the tag" >&2
          exit 1
        fi

    - name: Export a hash-pinned universal lockfile
      run: |
        uv export --no-emit-project --no-dev --extra postgres --format requirements-txt \
          > dist/requirements.lock.txt
        # Load-bearing: a lockfile without hashes makes --require-hashes a
        # no-op at install time, which would leave "checksum verified" true
        # of only Drover's own small fraction of the installed bytes.
        grep -q -- "--hash=sha256:" dist/requirements.lock.txt

    - name: Generate the checksum manifest
      run: |
        cd dist
        sha256sum drover-*-py3-none-any.whl requirements.lock.txt \
          > SHA256SUMS.txt
        sha256sum --check SHA256SUMS.txt

    # This must run before `gh release create`: install the exact built wheel
    # and its hash-pinned lock into a clean runtime, then check the same
    # PostgreSQL-default contract install.sh requires. Source imports are not
    # enough here: v0.4.18 had a main branch with the contract while its
    # published wheel did not.
    - name: Gate the candidate runtime before publication
      run: |
        CANDIDATE_ROOT="$(mktemp -d)"
        trap 'rm -rf "$CANDIDATE_ROOT"' EXIT
        uv venv --relocatable "$CANDIDATE_ROOT/runtime"
        uv pip install --python "$CANDIDATE_ROOT/runtime/bin/python" --require-hashes \
          -r dist/requirements.lock.txt
        uv pip install --python "$CANDIDATE_ROOT/runtime/bin/python" --no-deps \
          dist/drover-*-py3-none-any.whl
        python scripts/verify_release_candidate.py \
          --python "$CANDIDATE_ROOT/runtime/bin/python" \
          --server "$CANDIDATE_ROOT/runtime/bin/drover-server"

    - name: Gate managed PostgreSQL provisioner before publication
      run: |
        RUN_ID="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 4)"
        export DROVER_POSTGRES_INSTANCE="$RUN_ID" DROVER_POSTGRES_CONTAINER="drover-postgres-${RUN_ID}" DROVER_POSTGRES_VOLUME="drover-postgres-data-${RUN_ID}" DROVER_POSTGRES_PORT="$(python -c 'import random; print(random.randint(20000, 60999))')"
        export DROVER_HOME="$RUNNER_TEMP/drover-home-$RUN_ID" HOME="$RUNNER_TEMP/home-$RUN_ID"
        mkdir -p "$DROVER_HOME/bin" "$HOME"
        cp scripts/drover-managed-postgres "$DROVER_HOME/bin/drover-managed-postgres"
        chmod 700 "$DROVER_HOME/bin/drover-managed-postgres"
        CID=""; VID=""; MARKER="marker-$RUN_ID"
        cleanup() {
          if [ -n "$CID" ] && [ "$(docker inspect --format '{{.Id}} {{index .Config.Labels "io.drover.instance"}}' "$DROVER_POSTGRES_CONTAINER" 2>/dev/null || true)" = "$CID $RUN_ID" ]; then docker rm -f "$CID" || true; fi
          if [ -n "$VID" ] && [ "$(docker volume inspect --format '{{.Name}} {{index .Labels "io.drover.instance"}}' "$DROVER_POSTGRES_VOLUME" 2>/dev/null || true)" = "$VID $RUN_ID" ]; then docker volume rm "$VID" || true; fi
          rm -rf "$DROVER_HOME" "$HOME" "$RUNNER_TEMP/drover-managed-$RUN_ID.dump"
        }
        trap cleanup EXIT
        fail() { echo "$*" >&2; exit 1; }
        . scripts/lib/managed_postgres.sh
        ENV_FILE="$DROVER_HOME/server.env"
        BACKUP="$RUNNER_TEMP/drover-managed-$RUN_ID.dump"
        managed_postgres_start_or_reuse "$ENV_FILE"
        CID="$(docker inspect --format '{{.Id}}' "$DROVER_POSTGRES_CONTAINER")"
        VID="$(docker volume inspect --format '{{.Name}}' "$DROVER_POSTGRES_VOLUME")"
        managed_postgres_wait_ready "$ENV_FILE"
        managed_postgres_start_or_reuse "$ENV_FILE"
        PG_PASS="$(managed_postgres_env_password "$ENV_FILE")"
        PGPASSWORD="$PG_PASS" docker exec -e PGPASSWORD "$DROVER_POSTGRES_CONTAINER" \
          psql -h 127.0.0.1 -p 5432 -U drover -d drover -v ON_ERROR_STOP=1 \
          -c 'create table if not exists drover_release_marker(value text primary key)' \
          -c "insert into drover_release_marker(value) values ('$MARKER')"
        "$DROVER_HOME/bin/drover-managed-postgres" backup "$BACKUP"
        docker exec -i "$DROVER_POSTGRES_CONTAINER" pg_restore -l < "$BACKUP" | grep -q drover_release_marker
        PGPASSWORD="$PG_PASS" docker exec -e PGPASSWORD "$DROVER_POSTGRES_CONTAINER" \
          psql -h 127.0.0.1 -p 5432 -U drover -d postgres -v ON_ERROR_STOP=1 \
          -c 'drop database if exists drover_restore_check' \
          -c 'create database drover_restore_check owner drover'
        PGPASSWORD="$PG_PASS" docker exec -i -e PGPASSWORD "$DROVER_POSTGRES_CONTAINER" \
          pg_restore -h 127.0.0.1 -p 5432 -U drover -d drover_restore_check --no-owner < "$BACKUP"
        PGPASSWORD="$PG_PASS" docker exec -e PGPASSWORD "$DROVER_POSTGRES_CONTAINER" \
          psql -h 127.0.0.1 -p 5432 -U drover -d drover_restore_check -qAt \
          -c 'select value from drover_release_marker' | grep -qx "$MARKER"
        "$DROVER_HOME/bin/drover-managed-postgres" stop
        "$DROVER_HOME/bin/drover-managed-postgres" status 2>&1 | grep -q 'auth not checked'
        "$DROVER_HOME/bin/drover-managed-postgres" start
        bash scripts/uninstall.sh | grep -q 'preserved'
        [ "$(docker inspect --format '{{.Id}}' "$DROVER_POSTGRES_CONTAINER")" = "$CID" ]
        [ "$(docker volume inspect --format '{{.Name}}' "$DROVER_POSTGRES_VOLUME")" = "$VID" ]
        "$DROVER_HOME/bin/drover-managed-postgres" purge --i-understand-this-deletes-drover-postgres-data
        [ -z "$(docker ps -a --filter "name=^/${DROVER_POSTGRES_CONTAINER}$" --format '{{.ID}}')" ]
        [ -z "$(docker volume ls --filter "name=^${DROVER_POSTGRES_VOLUME}$" --format '{{.Name}}')" ]
        CID=""; VID=""

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${RELEASE_TAG}" \
          --title "${RELEASE_TAG}" \
          --generate-notes \
          dist/drover-*-py3-none-any.whl \
          dist/requirements.lock.txt \
          dist/SHA256SUMS.txt

  # Install the release we just published, on a clean machine, the way a
  # stranger would. Unit tests cannot catch this class of bug: v0.1.1 passed
  # every suite, published three correct artifacts, and still could not
  # install, because drover-server had no --version flag and install.sh
  # smoke-tests exactly that before activating. The only thing that finds
  # that is running the real script against the real release.
  #
  # Runs after publishing rather than before, because there is no release to
  # install until then. A failure here means the release is bad and should be
  # deleted, not that the check is wrong.
  verify-install:
    name: Install the published release on a clean machine
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Provision an isolated PostgreSQL control store
      run: |
        sudo apt-get update
        sudo apt-get install --yes postgresql
        sudo systemctl start postgresql
        for _ in $(seq 1 30); do
          sudo -u postgres pg_isready -q && break
          sleep 1
        done
        sudo -u postgres pg_isready -q \
          || { echo "PostgreSQL did not become ready" >&2; exit 1; }
        DB_PASSWORD="$(openssl rand -hex 24)"
        DB_DSN="postgresql://drover_release:${DB_PASSWORD}@127.0.0.1:5432/drover_release_check"
        echo "::add-mask::$DB_PASSWORD"
        echo "::add-mask::$DB_DSN"
        sudo -u postgres psql --set ON_ERROR_STOP=1 <<SQL
        CREATE ROLE drover_release LOGIN PASSWORD '${DB_PASSWORD}';
        CREATE DATABASE drover_release_check OWNER drover_release;
        SQL
        printf 'DROVER_CONTROL_DSN=%s\n' "$DB_DSN" >> "$GITHUB_ENV"

    - name: Wait for the release assets to be queryable
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.event.inputs.ref || github.ref_name }}"
        for _ in $(seq 1 30); do
          if gh release view "$TAG" --json assets \
               --jq '.assets[].name' | grep -q 'py3-none-any.whl'; then
            exit 0
          fi
          sleep 5
        done
        echo "release $TAG never exposed a wheel" >&2
        exit 1

    - name: Run install.sh exactly as a user would
      run: |
        if ! DROVER_CONTROL_DSN="$DROVER_CONTROL_DSN" bash install.sh --no-start \
          --version "${{ github.event.inputs.ref || github.ref_name }}" \
          > "$RUNNER_TEMP/drover-install.log" 2>&1; then
          echo "install stage failed" >&2
          exit 1
        fi

    - name: The runtime is laid out and activated
      run: |
        VERSION="$(echo "${{ github.event.inputs.ref || github.ref_name }}" | sed 's/^v//')"
        test -d "$HOME/.drover/runtime/$VERSION" \
          || { echo "no runtime/$VERSION" >&2; exit 1; }
        test -L "$HOME/.drover/runtime/current" \
          || { echo "current is not a symlink" >&2; exit 1; }
        test "$(readlink "$HOME/.drover/runtime/current")" = "$VERSION" \
          || { echo "current does not point at $VERSION" >&2; exit 1; }

    - name: The installed build runs and reports its own version
      run: |
        VERSION="$(echo "${{ github.event.inputs.ref || github.ref_name }}" | sed 's/^v//')"
        # This is the assertion v0.1.1 would have failed.
        "$HOME/.drover/runtime/current/bin/drover-server" --version
        "$HOME/.drover/runtime/current/bin/drover-server" --version \
          | grep -q "$VERSION"

    # Every other assertion here runs the binary by absolute path, which is
    # precisely how the gap survived: the install was correct and
    # `drover-server` still was not a command.
    - name: drover-server is reachable as a command, not just on disk
      run: |
        VERSION="$(echo "${{ github.event.inputs.ref || github.ref_name }}" | sed 's/^v//')"
        LINK="$HOME/.local/bin/drover-server"
        test -L "$LINK" \
          || { echo "the installer did not link drover-server" >&2; exit 1; }
        # Through current, so the link follows a symlink flip rather than
        # pinning the version that happened to be installed first.
        readlink "$LINK"
        readlink "$LINK" | grep -q 'runtime/current/bin/drover-server'
        # And it runs as a bare command name with that directory on PATH.
        PATH="$HOME/.local/bin:$PATH" drover-server --version | grep -q "$VERSION"

    - name: Config carries the detected address
      run: |
        grep -q '^advertised_url' "$HOME/.drover/config.toml"
        grep -q '^metrics_host' "$HOME/.drover/config.toml"

    - name: Service units point at current and set PATH explicitly
      run: |
        UNIT="$HOME/.config/systemd/user/drover-server.service"
        test -f "$UNIT" || { echo "no server unit written" >&2; exit 1; }
        test -f "$HOME/.config/systemd/user/drover-harnessd.service"
        # Both properties have silently broken real hosts before.
        grep -q 'Environment=PATH=' "$UNIT"
        grep -q 'EnvironmentFile=' "$UNIT"
        grep -q 'runtime/current/bin' "$UNIT"
        grep -qv 'runtime/0\.' "$UNIT"

    - name: The installed PostgreSQL control store is initialized and ready
      run: |
        BIN="$HOME/.drover/runtime/current/bin"
        set -a
        . "$HOME/.drover/server.env"
        set +a
        "$BIN/drover-server" control-store status > "$RUNNER_TEMP/drover-control-store.json"
        "$BIN/python" -c \
          'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["ready"] else 1)' \
          "$RUNNER_TEMP/drover-control-store.json"

    - name: Managed PostgreSQL install is healthy, idempotent, backed up, and preserved
      run: |
        MANAGED_HOME="$RUNNER_TEMP/drover-managed-home"
        VERSION="${{ github.event.inputs.ref || github.ref_name }}"
        RUN_ID="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        export DROVER_POSTGRES_INSTANCE="$RUN_ID"
        export DROVER_POSTGRES_CONTAINER="drover-postgres-${RUN_ID}"
        export DROVER_POSTGRES_VOLUME="drover-postgres-data-${RUN_ID}"
        export DROVER_POSTGRES_PORT="$((54000 + (GITHUB_RUN_ID % 1000)))"
        MANAGED_CONTAINER_ID=""
        MANAGED_VOLUME_ID=""
        cleanup_managed() {
          if [ -n "$MANAGED_CONTAINER_ID" ] && [ "$(docker inspect --format '{{.Id}} {{index .Config.Labels "io.drover.instance"}}' "$DROVER_POSTGRES_CONTAINER" 2>/dev/null || true)" = "$MANAGED_CONTAINER_ID $DROVER_POSTGRES_INSTANCE" ]; then docker rm -f "$DROVER_POSTGRES_CONTAINER" || true; fi
          if [ -n "$MANAGED_VOLUME_ID" ] && [ "$(docker volume inspect --format '{{.Name}} {{index .Labels "io.drover.instance"}}' "$DROVER_POSTGRES_VOLUME" 2>/dev/null || true)" = "$MANAGED_VOLUME_ID $DROVER_POSTGRES_INSTANCE" ]; then docker volume rm "$DROVER_POSTGRES_VOLUME" || true; fi
        }
        trap cleanup_managed EXIT
        HOME="$MANAGED_HOME" bash install.sh --no-start --control-store managed --version "$VERSION"
        MANAGED_CONTAINER_ID="$(docker inspect --format '{{.Id}}' "$DROVER_POSTGRES_CONTAINER")"
        MANAGED_VOLUME_ID="$(docker volume inspect --format '{{.Name}}' "$DROVER_POSTGRES_VOLUME")"
        HOME="$MANAGED_HOME" bash install.sh --no-start --control-store managed --version "$VERSION"
        test "$(docker inspect --format '{{index .Config.Labels "io.drover.instance"}}' "$DROVER_POSTGRES_CONTAINER")" = "$DROVER_POSTGRES_INSTANCE"
        docker port "$DROVER_POSTGRES_CONTAINER" 5432/tcp | grep -E '^127\.0\.0\.1:'
        set -a; . "$MANAGED_HOME/.drover/server.env"; set +a
        "$MANAGED_HOME/.drover/runtime/current/bin/drover-server" control-store status | "$MANAGED_HOME/.drover/runtime/current/bin/python" -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["ready"] else 1)'
        "$MANAGED_HOME/.drover/bin/drover-managed-postgres" backup "$RUNNER_TEMP/drover-managed-$RUN_ID.dump"
        test -s "$RUNNER_TEMP/drover-managed-$RUN_ID.dump"
        DROVER_HOME="$MANAGED_HOME/.drover" HOME="$MANAGED_HOME" bash scripts/uninstall.sh
        docker volume inspect "$DROVER_POSTGRES_VOLUME" >/dev/null
        DROVER_HOME="$MANAGED_HOME/.drover" HOME="$MANAGED_HOME" bash scripts/uninstall.sh --purge-managed-postgres --i-understand-this-deletes-drover-postgres-data
        ! docker volume inspect "$DROVER_POSTGRES_VOLUME" >/dev/null 2>&1

    - name: The installed server accepts a paired device
      run: |
        # Started directly rather than through systemd: `systemctl --user`
        # is not reliably available on a hosted runner. install.sh --no-start
        # wrote the normal config and unit definitions, but did not claim the
        # install is first-use ready; this step owns only its direct process.
        BIN="$HOME/.drover/runtime/current/bin"
        set -a
        . "$HOME/.drover/server.env"
        set +a
        "$BIN/drover-server" run > "$RUNNER_TEMP/drover-server.log" 2>&1 &
        SERVER_PID=$!
        cleanup_server() {
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
        }
        trap cleanup_server EXIT

        # The server binds [server].metrics_host, which install.sh sets to the
        # address it detected for the phone. Read that address and configured
        # port rather than assuming loopback or the default listener.
        HOST="$(sed -n 's/^[[:space:]]*metrics_host[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' \
          "$HOME/.drover/config.toml" | head -1)"
        PORT="$(sed -n 's/^[[:space:]]*metrics_http_port[[:space:]]*=[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' \
          "$HOME/.drover/config.toml" | head -1)"
        case "$HOST" in ""|"0.0.0.0"|"::"|"*") HOST="127.0.0.1" ;; esac
        case "$PORT" in ""|*[!0-9]*) echo "configured-address stage failed" >&2; exit 1 ;; esac
        for _ in $(seq 1 30); do
          curl -fsS --max-time 2 "http://$HOST:$PORT/healthz" \
            > /dev/null 2> "$RUNNER_TEMP/drover-health.log" && break
          sleep 2
        done
        curl -fsS --max-time 5 "http://$HOST:$PORT/healthz" \
          > /dev/null 2> "$RUNNER_TEMP/drover-health.log" \
          || { echo "server health stage failed" >&2; exit 1; }

        PAIR_OUTPUT="$("$BIN/drover-server" pair 2> "$RUNNER_TEMP/drover-pair.log")" \
          || { echo "pairing stage failed" >&2; exit 1; }
        PAIR_CODE="$(printf '%s\n' "$PAIR_OUTPUT" \
          | sed -n 's/.*[?&]code=\([^&[:space:]]*\).*/\1/p' | head -1)"
        [ -n "$PAIR_CODE" ] || { echo "pairing stage failed" >&2; exit 1; }
        if ! curl -fsS --max-time 10 -X POST \
          -H 'Content-Type: application/json' \
          -d "{\"code\":\"$PAIR_CODE\",\"device_name\":\"release-artifact-check\"}" \
          "http://$HOST:$PORT/auth/pair" \
          > "$RUNNER_TEMP/drover-pair-response.json" \
          2> "$RUNNER_TEMP/drover-pair-redemption.log"; then
          echo "pairing redemption stage failed" >&2
          exit 1
        fi
        DEVICE_TOKEN="$("$BIN/python" -c \
          'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["token"])' \
          "$RUNNER_TEMP/drover-pair-response.json")" \
          || { echo "pairing redemption stage failed" >&2; exit 1; }
        [ -n "$DEVICE_TOKEN" ] || { echo "pairing redemption stage failed" >&2; exit 1; }
        if ! curl -fsS --max-time 10 \
          -H "Authorization: Bearer $DEVICE_TOKEN" \
          "http://$HOST:$PORT/harness/hosts" \
          > "$RUNNER_TEMP/drover-hosts.json" \
          2> "$RUNNER_TEMP/drover-hosts.log"; then
          echo "paired control-access stage failed" >&2
          exit 1
        fi
        "$BIN/python" -c \
          'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))["hosts"]' \
          "$RUNNER_TEMP/drover-hosts.json" \
          || { echo "paired control-access stage failed" >&2; exit 1; }
        unset PAIR_OUTPUT PAIR_CODE DEVICE_TOKEN
