name: Site

# Build check for the static product and docs site under site/. It runs only
# when the site or this workflow changes; the Python and iOS suites in ci.yml
# and ios.yml skip themselves for site-only pull requests.
on:
  push:
    branches: [ "main" ]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Build
      run: npm run build

    # Internal links and anchors, content rules (no em dashes, no private
    # values, no third-party runtime requests) and a first-load size budget.
    - name: Check links, content and budget
      run: npm run check

    - name: Report build size
      run: du -sh dist
