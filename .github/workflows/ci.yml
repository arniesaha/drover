name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Configure git identity (for tests that create tmp git repos)
      run: |
        git config --global user.email "ci@drover.local"
        git config --global user.name "Drover CI"

    - name: Check formatting with Black
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          BASE_SHA="$(git rev-parse HEAD~1)"
        fi
        PY_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- 'src/**/*.py' 'tests/*.py' 'tests/**/*.py')"
        if [ -z "$PY_FILES" ]; then
          echo "No changed Python files to format-check."
        else
          echo "$PY_FILES" | xargs black --check
        fi

    - name: Run tests with pytest
      run: pytest tests/
