name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select test scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        python scripts/ci/select_test_scope.py \
          --base "$BASE_SHA" \
          --github-output "$GITHUB_OUTPUT"
    
    - name: Set up Python
      if: steps.scope.outputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      if: steps.scope.outputs.python == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Configure git identity (for tests that create tmp git repos)
      if: steps.scope.outputs.python == 'true'
      run: |
        git config --global user.email "ci@drover.local"
        git config --global user.name "Drover CI"

    - name: Check formatting with Black
      if: steps.scope.outputs.python == 'true'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          BASE_SHA="$(git rev-parse HEAD~1)"
        fi
        PY_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- 'src/**/*.py' 'tests/*.py' 'tests/**/*.py')"
        if [ -z "$PY_FILES" ]; then
          echo "No changed Python files to format-check."
        else
          echo "$PY_FILES" | xargs black --check
        fi

    - name: Run lightweight checks
      if: steps.scope.outputs.python != 'true'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git diff --check "$BASE_SHA"...HEAD
        python scripts/check_public_release.py

    - name: Run tests with pytest
      if: steps.scope.outputs.python == 'true'
      run: pytest tests/

    # The installer is shell, so pytest alone leaves it unguarded. Every
    # suite runs against stubs and temp directories and never touches the
    # network. Grouped per suite, and the loop keeps going so one failure
    # does not hide the others.
    - name: Run installer shell tests
      if: steps.scope.outputs.python == 'true'
      run: |
        bash -n install.sh
        bash -n scripts/lib/verify.sh
        bash -n scripts/lib/detect.sh
        status=0
        for suite in tests/shell/test_*.sh; do
          echo "::group::$suite"
          bash "$suite" || status=1
          echo "::endgroup::"
        done
        exit "$status"
