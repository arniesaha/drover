name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: apps/web/package-lock.json

    - name: Build the hub-served web client
      run: |
        npm ci --prefix apps/web --ignore-scripts
        npm run build --prefix apps/web
        test -f src/drover/server/web/static/client/client-manifest.json

    # A self-hosted runner attached to a public repository is one
    # fork-triggerable workflow away from arbitrary code execution on the
    # runner host. This repository had exactly that: a non-ephemeral runner
    # on the Mac mini that runs the live fleet, holding the DuckDB store, the
    # API token, the APNs keys and the fleet config. Nothing exploited it
    # only because the single workflow using it happened to be dispatch-only.
    # That is a configuration accident, not a boundary, so this makes the
    # absence structural: the next workflow to ask for one fails here.
    - name: No workflow may request a self-hosted runner
      run: |
        if grep -rnE '^[[:space:]]*runs-on:.*self-hosted' .github/workflows/; then
          echo "::error::the lines above request a self-hosted runner; this repo is public" >&2
          exit 1
        fi
        # The other spelling: `runs-on:` alone on its line, then a runner group.
        if grep -rn -A3 -E '^[[:space:]]*runs-on:[[:space:]]*$' .github/workflows/ \
             | grep -qE 'group:'; then
          echo "::error::a workflow selects a runner group; only GitHub-hosted runners are allowed" >&2
          exit 1
        fi
        echo "every workflow uses GitHub-hosted runners"

    # The static site under site/ has its own build check in site.yml. Its
    # paths are dropped before classification, so a pull request that only
    # touches the site runs the lightweight checks here instead of the Python
    # suite. Anything else in the same pull request is classified as usual,
    # and a push (no base) still runs everything.
    - name: Select test scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ -z "$BASE_SHA" ]; then
          python scripts/ci/select_test_scope.py --github-output "$GITHUB_OUTPUT"
          exit 0
        fi
        mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD \
          | grep -vE '^(site/|\.github/workflows/site\.yml$)' || true)
        if [ "${#paths[@]}" -eq 0 ]; then
          echo "only site paths changed; skipping the Python and iOS suites"
          printf 'python=false\nios=false\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python scripts/ci/select_test_scope.py \
          --github-output "$GITHUB_OUTPUT" "${paths[@]}"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      if: steps.scope.outputs.python == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # This creates an isolated runtime after the frontend build. The smoke
    # imports from the installed wheel while its current directory contains no
    # source checkout and invokes no Node tooling.
    - name: Check the installed wheel contains the web client
      if: steps.scope.outputs.python == 'true'
      run: |
        WHEEL_DIR="$(mktemp -d)"
        RUNTIME_DIR="$(mktemp -d)"
        trap 'rm -rf "$WHEEL_DIR" "$RUNTIME_DIR"' EXIT
        python -m pip wheel --no-deps --wheel-dir "$WHEEL_DIR" .
        python -m venv "$RUNTIME_DIR"
        "$RUNTIME_DIR/bin/python" -m pip install --no-deps "$WHEEL_DIR"/drover-*.whl
        python scripts/check_web_client_wheel.py --python "$RUNTIME_DIR/bin/python"

    # Shell fixtures import the real config and service-unit renderer even
    # when an iOS-only diff skips the Python suite. Keep their interpreter
    # and config dependency independent of the selected test scope.
    - name: Install shell test dependencies
      if: steps.scope.outputs.python != 'true'
      run: python -m pip install "pydantic>=2.0"

    - name: Configure git identity (for tests that create tmp git repos)
      if: steps.scope.outputs.python == 'true'
      run: |
        git config --global user.email "ci@drover.local"
        git config --global user.name "Drover CI"

    - name: Check imports with isort
      if: steps.scope.outputs.python == 'true'
      # Every tracked Python file, not just the changed ones. The changed-file
      # globs covered `src/**` and `tests/**` and nothing else, so `scripts/`
      # was never checked -- which is how an unformatted file sat on main
      # unnoticed, and how the Loop Engine driver under `scripts/loop_engine/`
      # would have gone unchecked too. `git ls-files` is the same tracked-only
      # basis `check_public_release.py` already uses, so generated and
      # gitignored trees such as `docs/internal/` stay out of scope.
      run: git ls-files '*.py' -z | xargs -0 isort --check-only
    - name: Check formatting with Black
      if: steps.scope.outputs.python == 'true'
      # Every tracked Python file, not just the changed ones. The changed-file
      # globs covered `src/**` and `tests/**` and nothing else, so `scripts/`
      # was never checked -- which is how an unformatted file sat on main
      # unnoticed, and how the Loop Engine driver under `scripts/loop_engine/`
      # would have gone unchecked too. `git ls-files` is the same tracked-only
      # basis `check_public_release.py` already uses, so generated and
      # gitignored trees such as `docs/internal/` stay out of scope.
      run: git ls-files '*.py' -z | xargs -0 black --check
    - name: Run lightweight checks
      if: steps.scope.outputs.python != 'true'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git diff --check "$BASE_SHA"...HEAD
        python scripts/check_public_release.py

    - name: Run tests with pytest
      if: steps.scope.outputs.python == 'true'
      env:
        # A loaded runner needs more patience than an idle laptop. Waits scale
        # by this; a wait that succeeds still returns as soon as its predicate
        # is true, so the larger ceiling costs time only when something is
        # genuinely broken. See tests/_timeouts.py and drover#250.
        DROVER_TEST_TIMEOUT_SCALE: "4"
      # Two workers, not `auto`. `auto` counts cores, and this runner has 4 --
      # but these tests spawn their own subprocesses and HTTP servers, so four
      # workers put roughly three times that many processes on four vCPUs and
      # every worker's children compete with every other worker's tests.
      # Measured across 40 CI runs: `-n auto` cut median wall clock from 9.6 to
      # 4.0 minutes and raised the failure rate from 8% to 27%, with one run
      # stretching to 35 minutes. Two keeps most of the speedup and leaves the
      # runner room for the children. Revisit with numbers, not intuition.
      run: pytest tests/ --ignore=tests/acceptance -n 2

    # The installer is shell, so pytest alone leaves it unguarded. Every
    # suite runs against stubs and temp directories and never touches the
    # network. Grouped per suite, and the loop keeps going so one failure
    # does not hide the others.
    - name: Run installer shell tests
      run: |
        bash -n install.sh
        bash -n scripts/lib/verify.sh
        bash -n scripts/lib/detect.sh
        bash -n scripts/lib/managed_postgres.sh
        bash -n scripts/drover-managed-postgres scripts/uninstall.sh
        status=0
        for suite in tests/shell/test_*.sh; do
          echo "::group::$suite"
          bash "$suite" || status=1
          echo "::endgroup::"
        done
        exit "$status"

  harnessd-contract:
    name: harnessd contract (${{ matrix.impl }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both implementations must pass the identical Phase 2 envelope.
        impl: [py, rs]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install contract dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Build required Rust contract binary
      if: matrix.impl == 'rs'
      run: cargo build --locked --release -p drover-harnessd
    - name: Run shared Phase 2 black-box contract subset
      env:
        HARNESSD_IMPL: ${{ matrix.impl }}
      run: pytest tests/contract -m rust_phase2 -q --junitxml=contract-${{ matrix.impl }}.xml
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: harnessd-contract-${{ matrix.impl }}
        path: contract-${{ matrix.impl }}.xml

  harnessd-rust-phase2:
    name: harnessd Rust phase 2 (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable && rustup target add ${{ matrix.target }}
    - name: Install Linux musl tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install contract dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Format and lint
      run: |
        cargo fmt --check
        cargo clippy -p drover-harnessd --target ${{ matrix.target }} -- -D warnings
    - name: Build, test, and run Rust MVP contracts
      run: |
        cargo test -p drover-harnessd --target ${{ matrix.target }}
        cargo build --release -p drover-harnessd --target ${{ matrix.target }}
        mkdir -p target/release
        cp target/${{ matrix.target }}/release/drover-harnessd target/release/drover-harnessd
        if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
          file target/release/drover-harnessd | tee /tmp/harnessd-file.txt
          grep -E 'static(ally linked|[- ]pie linked)' /tmp/harnessd-file.txt
        fi
        pytest tests/contract --daemon=rust -m rust_phase2 -q --junitxml=contract-${{ matrix.target }}.xml
        pytest tests/contract/test_rust_migration_contract.py --daemon=rust -q
    - name: Package pilot binary and checksums
      shell: bash
      run: |
        mkdir -p pilot-artifacts
        asset="drover-harnessd-${{ matrix.target }}"
        cp target/${{ matrix.target }}/release/drover-harnessd "pilot-artifacts/$asset"
        if [ "${{ runner.os }}" = Darwin ] || [ "${{ runner.os }}" = macOS ]; then
          codesign --force --sign - "pilot-artifacts/$asset"
          codesign --verify --strict "pilot-artifacts/$asset"
        fi
        python - "$asset" <<'PY'
        import hashlib, pathlib, sys
        path = pathlib.Path("pilot-artifacts") / sys.argv[1]
        size = path.stat().st_size
        digest = hashlib.sha256(path.read_bytes()).hexdigest()
        (path.parent / "SHA256SUMS").write_text(f"{digest}  {path.name}\n")
        with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
            out.write(f"{path.name}: {size:,} bytes; sha256 `{digest}`\n")
        PY
    # GitHub's OIDC identity signs provenance for the exact binary digest.
    # Release macOS assets additionally use Developer ID + notarization.
    - uses: actions/attest-build-provenance@v3
      if: github.event.pull_request.head.repo.fork != true
      with:
        subject-path: pilot-artifacts/drover-harnessd-${{ matrix.target }}
    - uses: actions/upload-artifact@v4
      with:
        name: harnessd-pilot-${{ matrix.target }}
        path: |
          pilot-artifacts/*
          contract-${{ matrix.target }}.xml

  postgres-integration:
    # This job is intentionally unconditional. A documentation-only change may
    # skip the general Python suite, but the PostgreSQL serving contract must
    # keep running on every pull request and main push.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: drover
          POSTGRES_USER: drover
          POSTGRES_PASSWORD: drover-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drover -d drover"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DROVER_TEST_POSTGRES_DSN: postgresql://drover:drover-ci-only@127.0.0.1:5432/drover
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install PostgreSQL test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,postgres]"

    - name: Require the PostgreSQL service
      run: |
        python - <<'PY'
        import os
        import psycopg

        dsn = os.environ.get("DROVER_TEST_POSTGRES_DSN")
        if not dsn:
            raise SystemExit("DROVER_TEST_POSTGRES_DSN is required")
        with psycopg.connect(dsn) as connection:
            assert connection.execute("SELECT 1").fetchone() == (1,)
        PY

    - name: Run mandatory PostgreSQL integration contracts
      run: |
        pytest \
          tests/test_postgres_control_store.py \
          tests/test_control_outbox.py \
          tests/test_control_migration.py \
          tests/test_control_exporter.py \
          tests/test_runtime_roles.py \
          tests/test_postgres_control_benchmark.py \
          tests/test_memory_store.py \
          tests/test_embeddings.py \
          tests/test_ledger.py \
          tests/test_memory_integrity.py \
          tests/test_readiness_memory.py -m 'not pgvector' -q

    - name: Get DuckDB extension cache version
      id: lake-extension-version
      run: |
        python -c 'import duckdb; print("version=" + duckdb.__version__)' >> "$GITHUB_OUTPUT"

    - name: Cache pinned DuckDB extensions
      uses: actions/cache@v4
      with:
        path: ~/.cache/drover-lake-ext
        key: ${{ runner.os }}-drover-lake-ext-${{ steps.lake-extension-version.outputs.version }}-${{ hashFiles('src/drover/server/lake/runtime.py') }}

    - name: Provision and verify pinned DuckDB extensions
      run: |
        scripts/fetch-lake-extensions.sh "$HOME/.cache/drover-lake-ext"
        echo "DROVER_TEST_LAKE_EXTENSIONS=$HOME/.cache/drover-lake-ext" >> "$GITHUB_ENV"

    - name: Run DuckLake v2 acceptance contracts
      run: |
        pytest tests/acceptance -m "not acceptance_scale" -q

  pgvector-memory-integration:
    # Unconditional release gate; keep the plain PostgreSQL job above as well.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: drover
          POSTGRES_USER: drover
          POSTGRES_PASSWORD: drover-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U drover -d drover"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DROVER_TEST_POSTGRES_DSN: postgresql://drover:drover-ci-only@127.0.0.1:5432/drover
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install locked test runner
      run: python -m pip install "uv==0.12.19"
    - name: Run mandatory pgvector memory contracts (no skips)
      run: |
        uv run --python 3.11 --locked --extra dev pytest --require-pgvector -m pgvector \
          tests/test_memory_store.py tests/test_embeddings.py -v -s

    - name: Compare released schema with the production dump including vector types
      run: |
        uv run --python 3.11 --locked --extra dev pytest --require-pgvector \
          tests/acceptance/test_drift_guards.py -q
