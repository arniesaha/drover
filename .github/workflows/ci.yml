name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # A self-hosted runner attached to a public repository is one
    # fork-triggerable workflow away from arbitrary code execution on the
    # runner host. This repository had exactly that: a non-ephemeral runner
    # on the Mac mini that runs the live fleet, holding the DuckDB store, the
    # API token, the APNs keys and the fleet config. Nothing exploited it
    # only because the single workflow using it happened to be dispatch-only.
    # That is a configuration accident, not a boundary, so this makes the
    # absence structural: the next workflow to ask for one fails here.
    - name: No workflow may request a self-hosted runner
      run: |
        if grep -rnE '^[[:space:]]*runs-on:.*self-hosted' .github/workflows/; then
          echo "::error::the lines above request a self-hosted runner; this repo is public" >&2
          exit 1
        fi
        # The other spelling: `runs-on:` alone on its line, then a runner group.
        if grep -rn -A3 -E '^[[:space:]]*runs-on:[[:space:]]*$' .github/workflows/ \
             | grep -qE 'group:'; then
          echo "::error::a workflow selects a runner group; only GitHub-hosted runners are allowed" >&2
          exit 1
        fi
        echo "every workflow uses GitHub-hosted runners"

    - name: Select test scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        python scripts/ci/select_test_scope.py \
          --base "$BASE_SHA" \
          --github-output "$GITHUB_OUTPUT"
    
    - name: Set up Python
      if: steps.scope.outputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      if: steps.scope.outputs.python == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Configure git identity (for tests that create tmp git repos)
      if: steps.scope.outputs.python == 'true'
      run: |
        git config --global user.email "ci@drover.local"
        git config --global user.name "Drover CI"

    - name: Check imports with isort
      if: steps.scope.outputs.python == 'true'
      # Every tracked Python file, not just the changed ones. The changed-file
      # globs covered `src/**` and `tests/**` and nothing else, so `scripts/`
      # was never checked -- which is how an unformatted file sat on main
      # unnoticed, and how the Loop Engine driver under `scripts/loop_engine/`
      # would have gone unchecked too. `git ls-files` is the same tracked-only
      # basis `check_public_release.py` already uses, so generated and
      # gitignored trees such as `docs/internal/` stay out of scope.
      run: git ls-files '*.py' -z | xargs -0 isort --check-only
    - name: Check formatting with Black
      if: steps.scope.outputs.python == 'true'
      # Every tracked Python file, not just the changed ones. The changed-file
      # globs covered `src/**` and `tests/**` and nothing else, so `scripts/`
      # was never checked -- which is how an unformatted file sat on main
      # unnoticed, and how the Loop Engine driver under `scripts/loop_engine/`
      # would have gone unchecked too. `git ls-files` is the same tracked-only
      # basis `check_public_release.py` already uses, so generated and
      # gitignored trees such as `docs/internal/` stay out of scope.
      run: git ls-files '*.py' -z | xargs -0 black --check
    - name: Run lightweight checks
      if: steps.scope.outputs.python != 'true'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git diff --check "$BASE_SHA"...HEAD
        python scripts/check_public_release.py

    - name: Run tests with pytest
      if: steps.scope.outputs.python == 'true'
      env:
        # A loaded runner needs more patience than an idle laptop. Waits scale
        # by this; a wait that succeeds still returns as soon as its predicate
        # is true, so the larger ceiling costs time only when something is
        # genuinely broken. See tests/_timeouts.py and drover#250.
        DROVER_TEST_TIMEOUT_SCALE: "4"
      # Two workers, not `auto`. `auto` counts cores, and this runner has 4 --
      # but these tests spawn their own subprocesses and HTTP servers, so four
      # workers put roughly three times that many processes on four vCPUs and
      # every worker's children compete with every other worker's tests.
      # Measured across 40 CI runs: `-n auto` cut median wall clock from 9.6 to
      # 4.0 minutes and raised the failure rate from 8% to 27%, with one run
      # stretching to 35 minutes. Two keeps most of the speedup and leaves the
      # runner room for the children. Revisit with numbers, not intuition.
      run: pytest tests/ -n 2

    # The installer is shell, so pytest alone leaves it unguarded. Every
    # suite runs against stubs and temp directories and never touches the
    # network. Grouped per suite, and the loop keeps going so one failure
    # does not hide the others.
    - name: Run installer shell tests
      if: steps.scope.outputs.python == 'true'
      run: |
        bash -n install.sh
        bash -n scripts/lib/verify.sh
        bash -n scripts/lib/detect.sh
        status=0
        for suite in tests/shell/test_*.sh; do
          echo "::group::$suite"
          bash "$suite" || status=1
          echo "::endgroup::"
        done
        exit "$status"
