[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drover"
version = "0.3.7"
description = "Drover — local-first cockpit and context layer for driving a personal fleet of CLI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.1",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "watchdog>=4.0",
    "opentelemetry-proto>=1.30",
    "grpcio>=1.60",
    # Upper bound is load-bearing: mcp 2.0 removed mcp.server.fastmcp, which
    # drover.server.mcp.server imports. Floor is 1.2, the release that first
    # shipped FastMCP in the official SDK (verified against 1.2.0 and 1.29.0).
    "mcp>=1.2,<2",
    "pytz",
    "anthropic>=0.40",
    "requests",
    "PyYAML>=6.0",
    # Pure Python with no transitive dependencies, which matters for an
    # install path that has to work everywhere. Renders the pairing QR.
    "segno>=1.6",
    # APNs push. Both were already present transitively (httpx under anthropic,
    # cryptography under it), so the only genuinely new wheel is h2 -- but this
    # path imports them directly and an undeclared transitive dep is one
    # upstream release away from vanishing. The http2 extra is not optional:
    # the APNs provider API speaks HTTP/2 only, and httpx raises at client
    # construction if the h2 package is missing.
    "httpx[http2]>=0.27",
    "cryptography>=42.0",
]

[project.scripts]
drover-server = "drover.server.__main__:main"
drover-harnessd = "drover.server.harness.cli:main"
drover-collect = "drover.collect.__main__:main"
drover-hook = "drover.hook.__main__:main"
drover-dogfood-smoke = "drover.server.dogfood_smoke:main"

[project.optional-dependencies]
dev = [
    "pytest",
    # The suite is dominated by wait, not compute: after the drover#238 fix it
    # runs at 42% CPU. Worker count is measured, not derived from core count;
    # see roadmap operations/2026-08-18-test-suite-cost-baseline.md.
    "pytest-xdist",
    "black",
    "isort"
]
redis = [
    "redis>=5.0",
]

[tool.setuptools.package-data]
drover = ["prompts/*.md", "server/web/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Passing tests stop leaving their tmp_path behind. The harness suites write a
# DuckDB per test, so the default ("all", kept for the last 3 runs) reached
# 8.2 GB in a single day of local runs. A failed test still keeps its directory,
# which is the only time anyone actually goes looking for one.
tmp_path_retention_policy = "failed"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
